<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#155bd7">
<meta name="description" content="Une liste de courses simple, sauvegardée dans votre navigateur.">
<title>Ma liste de courses</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23155bd7'/%3E%3Cpath d='m8 16 5 5 11-11' fill='none' stroke='white' stroke-width='3'/%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#17243a;font:16px/1.5 system-ui,sans-serif}main{max-width:620px;margin:48px auto;padding:0 20px}h1{font-size:2rem;letter-spacing:-.04em;margin:0 0 4px}.counter{color:#526279;margin:0 0 26px}form{display:flex;gap:10px;margin-bottom:24px}input[type=text]{min-width:0;flex:1;padding:14px;border:1px solid #becadb;border-radius:12px;font:inherit;background:white}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 16px;background:#155bd7;color:white;font-weight:600}button:hover{filter:brightness(.93)}:focus-visible{outline:3px solid #f3ac22;outline-offset:3px}ul{list-style:none;margin:0;padding:0;background:white;border:1px solid #dce3ee;border-radius:16px;overflow:hidden}li{display:flex;align-items:center;gap:12px;padding:14px 16px;border-bottom:1px solid #e8edf5}li:last-child{border:0}label{display:flex;align-items:center;gap:14px;flex:1;min-width:0;cursor:pointer;overflow-wrap:anywhere}input[type=checkbox]{width:24px;height:24px;accent-color:#155bd7;flex-shrink:0}.done span{text-decoration:line-through;color:#6b778a}.delete{background:transparent;color:#66758b;padding:6px 12px;font-size:24px;line-height:1}.empty{text-align:center;color:#526279;padding:34px 15px;border:1px dashed #becadb;border-radius:16px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.secondary{background:#e2eaf6;color:#24446f;font-size:14px}button:disabled{opacity:.45;cursor:default}.note{font-size:14px;color:#66758b;margin-top:28px}.error{color:#a32323;font-size:14px}[hidden]{display:none!important}@media(max-width:480px){main{margin:28px auto}h1{font-size:1.8rem}form{gap:8px}form button{padding:12px}li{padding:14px 12px}}
</style>
</head>
<body><main>
<h1>Ma liste de courses</h1>
<p class="counter" id="counter" aria-live="polite"></p>
<form id="add"><input type="text" id="article" maxlength="200" aria-label="Article à ajouter" placeholder="Ajouter un article…" autocomplete="off" required><button>Ajouter</button></form>
<ul id="list" aria-label="Liste de courses"></ul>
<p class="empty" id="empty">La liste est vide.<br>Ajoutez votre premier article ci-dessus.</p>
<div class="actions"><button class="secondary" id="reset">Tout décocher</button><button class="secondary" id="clear">Supprimer les articles cochés</button></div>
<p class="note">Votre liste reste enregistrée dans ce navigateur, sur cet appareil.</p>
<p class="error" id="error" role="alert" hidden>La sauvegarde est indisponible dans ce navigateur. Gardez cette page ouverte pour conserver votre liste.</p>
</main>
<script>
'use strict';
const key='artefacts-courses-v1';
let items=[];
try{const data=JSON.parse(localStorage.getItem(key)||JSON.stringify([{id:'citron',name:'4–5 citrons verts',done:false},{id:'concombre',name:'Concombre',done:false},{id:'menthe',name:'Menthe',done:false},{id:'mangue',name:'Mangue (la plus mûre possible)',done:false}]));if(Array.isArray(data))items=data.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&typeof x.done==='boolean')}catch(e){document.getElementById('error').hidden=false}
for(const item of items){if(item.id==='citron' && item.name==='Citrons verts')item.name='4–5 citrons verts'}
try{if(!localStorage.getItem('artefacts-courses-salad-added-v1')){if(!items.some(x=>x.id==='salade'))items.push({id:'salade',name:'Salade',done:false});localStorage.setItem(key,JSON.stringify(items));localStorage.setItem('artefacts-courses-salad-added-v1','1')}}catch(e){if(!items.some(x=>x.id==='salade'))items.push({id:'salade',name:'Salade',done:false});document.getElementById('error').hidden=false}
const list=document.getElementById('list'),input=document.getElementById('article');
function save(){try{localStorage.setItem(key,JSON.stringify(items))}catch(e){document.getElementById('error').hidden=false}render()}
function render(){
 list.replaceChildren();
 const done=items.filter(x=>x.done).length,remaining=items.length-done;
 document.getElementById('counter').textContent=items.length?remaining+' article'+(remaining>1?'s':'')+' à acheter · '+done+'/'+items.length+' coché'+(done>1?'s':''):'Prête pour les prochaines courses';
 document.getElementById('empty').hidden=items.length>0;list.hidden=!items.length;
 document.getElementById('reset').disabled=!done;document.getElementById('clear').disabled=!done;
 for(const item of [...items].sort((a,b)=>Number(a.done)-Number(b.done))){
 const li=document.createElement('li');li.className=item.done?'done':'';
 const label=document.createElement('label'),check=document.createElement('input'),span=document.createElement('span'),del=document.createElement('button');
 check.type='checkbox';check.checked=item.done;span.textContent=item.name;
 check.addEventListener('change',()=>{item.done=check.checked;save();const restored=list.querySelector('[data-id="'+item.id+'"]');if(restored)restored.focus()});
 check.dataset.id=item.id;
 del.type='button';del.className='delete';del.textContent='×';del.setAttribute('aria-label','Supprimer '+item.name);
 del.addEventListener('click',()=>{items=items.filter(x=>x.id!==item.id);save()});
 label.append(check,span);li.append(label,del);list.append(li);
 }
}
document.getElementById('add').addEventListener('submit',e=>{e.preventDefault();const name=input.value.trim();if(!name)return;items.push({id:typeof crypto.randomUUID==='function'?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2),name,done:false});input.value='';save();input.focus()});
document.getElementById('reset').addEventListener('click',()=>{items.forEach(x=>x.done=false);save()});
document.getElementById('clear').addEventListener('click',()=>{items=items.filter(x=>!x.done);save()});
window.addEventListener('storage',e=>{if(e.key===key){try{const data=JSON.parse(e.newValue||'[]');if(Array.isArray(data)){items=data.filter(x=>x&&typeof x.id==='string'&&typeof x.name==='string'&&typeof x.done==='boolean');render()}}catch(err){}}});
render();
</script></body></html>
